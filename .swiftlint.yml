disabled_rules:
  - identifier_name
  - trailing_comma
opt_in_rules:
  - empty_count
  - trailing_newline
  - colon
  - comma
excluded:
  - .build
  - ish-repo
  - Pods
line_length:
  warning: 120
  error: 200
file_length:
  warning: 500
  error: 1000
type_body_length:
  warning: 300
  error: 500
function_body_length:
  warning: 50
  error: 100
